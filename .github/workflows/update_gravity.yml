name: Update Prize Gravity Data

on:
  workflow_dispatch: # ボタンから手動実行

jobs:
  update-gravity:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Latest Gravity Data
        run: |
          python -X utf8 fetch_merry_gravity.py 3500

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gravity_data.json gravity_sync_info.json gravity.html
          if git diff --staged --quiet; then
            echo "No changes in gravity data."
          else
            git commit -m "🤖 最新X投稿を自動収集・更新"
            git push origin main
          fi
