name: Update Prize Gravity Data

on:
  schedule:
    # 毎朝日本時間 08:00 に全自動巡回・収集 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 必要に応じて手動実行も可能

jobs:
  update-gravity:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Latest Gravity Data
        run: |
          python -X utf8 fetch_merry_gravity.py 3500

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gravity_data.json gravity_sync_info.json gravity.html
          if git diff --staged --quiet; then
            echo "No changes in gravity data."
          else
            git commit -m "🤖 毎朝自動巡回: 最新X投稿を収集・更新 [skip ci]"
            git push origin main
          fi
